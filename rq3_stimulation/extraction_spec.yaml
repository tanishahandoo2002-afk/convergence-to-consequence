# Which table cell holds each arm of each effect, for rq3_stimulation/extract_pmc.py. Cells are [row, col] in the
# table body, counting from 0. Study facts, montages and RoB 2 ratings are an AI assistant's reading of the paper;
# every choice is for the author to review (CHANGELOG.md, 2026-11-08).
# Rules: the first memory test after the stimulation protocol ends; one measure per test (delayed recall for list
# learning, else the paper's primary measure); with several active arms, the sham n is split evenly between them.
studies:
  - record_id: "pmid:41847588"
    population: healthy
    diagnostic_criteria: ""
    design: parallel
    stim: tACS
    timing: encoding
    montages:
      pfc_ppc: {anode: F3, cathode: P3, other_electrodes: "", size_cm2: 35, current_mA: 1.5, type: tACS}
      pfc: {anode: F3, cathode: right deltoid, other_electrodes: "", size_cm2: 35, current_mA: 1.5, type: tACS}
    rob2: {d1_randomisation: some, d1b_carryover: "", d2_deviations: some, d3_missing: low, d4_measurement: low,
           d5_selection: some, overall: some}
    check: "60 Hz tACS during learning on day 1; day 1 recognition is the first test. Check whether 1.5 mA is peak to peak (the paper gives 0.06 mA/cm2 with 35 cm2 sponges). RoB 2: allocation method not described, blinding not tested, no registration found."
    effects:
      - {montage: pfc_ppc, test_name: "word recognition d', day 1", test_type: recognition, followup_days: 0, sessions: 1,
         n_active: 17, n_sham: 8, higher_is_better: 1, table: "Table 2", active: [0, 2], sham: [2, 1],
         check: "Sham n of 17 split with the PFC arm."}
      - {montage: pfc, test_name: "word recognition d', day 1", test_type: recognition, followup_days: 0, sessions: 1,
         n_active: 17, n_sham: 8, higher_is_better: 1, table: "Table 2", active: [1, 1], sham: [2, 1],
         check: "Sham n of 17 split with the PFC-PPC arm."}
