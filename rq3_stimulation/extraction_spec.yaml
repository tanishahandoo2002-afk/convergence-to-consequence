# Which table cell holds each arm of each effect, for rq3_stimulation/extract_pmc.py. Cells are [row, col] in the
# table body, counting from 0. Study facts, montages and RoB 2 ratings are an AI assistant's reading of the paper;
# every choice is for the author to review (CHANGELOG.md, 2026-11-08).
# Rules: the first memory test after the stimulation protocol ends; one measure per test (delayed recall for list
# learning, else the paper's primary measure); with several active arms, the sham n is split evenly between them.
studies:
  - record_id: "pmid:41847588"
    population: healthy
    diagnostic_criteria: ""
    design: parallel
    stim: tACS
    timing: encoding
    montages:
      pfc_ppc: {anode: F3, cathode: P3, other_electrodes: "", size_cm2: 35, current_mA: 1.5, type: tACS}
      pfc: {anode: F3, cathode: right deltoid, other_electrodes: "", size_cm2: 35, current_mA: 1.5, type: tACS}
    rob2: {d1_randomisation: some, d1b_carryover: "", d2_deviations: some, d3_missing: low, d4_measurement: low,
           d5_selection: some, overall: some}
    check: "60 Hz tACS during learning on day 1; day 1 recognition is the first test. Check whether 1.5 mA is peak to peak (the paper gives 0.06 mA/cm2 with 35 cm2 sponges). RoB 2: allocation method not described, blinding not tested, no registration found."
    effects:
      - {montage: pfc_ppc, test_name: "word recognition d', day 1", test_type: recognition, followup_days: 0, sessions: 1,
         n_active: 17, n_sham: 8, higher_is_better: 1, table: "Table 2", active: [0, 2], sham: [2, 1],
         check: "Sham n of 17 split with the PFC arm."}
      - {montage: pfc, test_name: "word recognition d', day 1", test_type: recognition, followup_days: 0, sessions: 1,
         n_active: 17, n_sham: 8, higher_is_better: 1, table: "Table 2", active: [1, 1], sham: [2, 1],
         check: "Sham n of 17 split with the PFC-PPC arm."}
  - record_id: "pmid:41699869"
    population: healthy
    diagnostic_criteria: ""
    design: parallel
    stim: tACS
    timing: offline
    montages:
      ppc: {anode: P3, cathode: right cheek, other_electrodes: "", size_cm2: 19.6, current_mA: 2, type: tACS}
    rob2: {d1_randomisation: some, d1b_carryover: "", d2_deviations: low, d3_missing: low, d4_measurement: low,
           d5_selection: some, overall: some}
    check: "Individual theta tACS for 20 min between encoding and recognition. 2 mA is peak to peak; the 5-cm round sponges give 19.6 cm2. RoB 2: randomisation method not described, single blind, no registration found."
    effects:
      - {montage: ppc, test_name: "FAST correct old pairs", test_type: recognition, followup_days: 0, sessions: 1,
         n_active: 15, n_sham: 15, higher_is_better: 1, table: "Table 1", active: [4, 1], sham: [4, 2],
         check: "Old-pair hits taken as the associative measure; recombined-pair rejections (row 6) are the alternative. Decimal commas in the table."}
  - record_id: "pmid:39883628"
    population: healthy
    diagnostic_criteria: ""
    design: parallel
    stim: tDCS
    timing: offline
    montages:
      ppc: {anode: P3, cathode: right cheek, other_electrodes: "", size_cm2: 25, current_mA: 1.5, type: tDCS}
    rob2: {d1_randomisation: some, d1b_carryover: "", d2_deviations: low, d3_missing: low, d4_measurement: low,
           d5_selection: some, overall: some}
    check: "Three daily sessions; the posttest one day after the third is the first test after the protocol. The current reads as 1.5 mA but the text was split at the decimal point, so check it. n is 29 per group (30 and 29 randomised, 58 in the ANOVA). RoB 2: allocation concealment not described."
    effects:
      - {montage: ppc, test_name: "face-cued word recall (proportion)", test_type: recall, followup_days: 1, sessions: 3,
         n_active: 29, n_sham: 29, higher_is_better: 1, table: "Table 1", active: [1, 6], sham: [1, 5]}
      - {montage: ppc, test_name: "RAVLT delayed recall", test_type: recall, followup_days: 1, sessions: 3,
         n_active: 29, n_sham: 29, higher_is_better: 1, table: "Table 1", active: [5, 6], sham: [5, 5]}
  - record_id: "pmid:38966802"
    population: MCI
    diagnostic_criteria: Petersen 2011
    design: parallel
    stim: tDCS
    timing: offline
    montages:
      f3: {anode: F3, cathode: Fp2, other_electrodes: "", size_cm2: 35, current_mA: 2, type: tDCS}
    rob2: {d1_randomisation: low, d1b_carryover: "", d2_deviations: low, d3_missing: some, d4_measurement: some,
           d5_selection: low, overall: some}
    check: "12 sessions of 25-min tDCS with VR training; T1 (post-treatment) is the first test after the protocol. Only the anodal and placebo tDCS arms are used. The cathode is over the right supraorbital area, coded as Fp2. RoB 2: registered (NCT03486704), 8% missing under mITT, assessor blinding not found."
    effects:
      - {montage: f3, test_name: "RAVLT delayed recall", test_type: recall, followup_days: 0, sessions: 12,
         n_active: 23, n_sham: 21, higher_is_better: 1, table: "Table 2", active: [18, 2], sham: [18, 6]}
      - {montage: f3, test_name: "FCSRT delayed free recall", test_type: recall, followup_days: 0, sessions: 12,
         n_active: 23, n_sham: 21, higher_is_better: 1, table: "Table 2", active: [22, 2], sham: [22, 6]}
      - {montage: f3, test_name: "ROCF delayed recall", test_type: recall, followup_days: 0, sessions: 12,
         n_active: 23, n_sham: 21, higher_is_better: 1, table: "Table 2", active: [25, 2], sham: [25, 6]}
  - record_id: "pmid:38178837"
